services:
  bot:
    build: .
    image: vaqtuz-finance-bot:latest
    container_name: vaqtuz-finance-bot
    restart: unless-stopped
    # Dokploy sozlamalarni o'z panelidan konteynerga uzatadi va .env fayli
    # bo'lmasligi mumkin — shuning uchun majburiy emas. Qo'lda deployda
    # (docker compose up) .env fayli o'qiladi.
    env_file:
      - path: .env
        required: false
    environment:
      # Baza konteyner ichida doim shu yerda — payments_data volume'ida saqlanadi
      DB_PATH: /data/payments.db
    volumes:
      - payments_data:/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named volume — bind-mount emas. Sababi: konteyner root'siz (uid 10001)
  # ishlaydi, bind-mount esa Linux'da root egaligida yaratilib yozishga
  # ruxsat bermay qo'yadi. Named volume image'dagi /data huquqlarini oladi.
  # Zaxira nusxa olish uchun: make backup
  payments_data:

networks:
  # IPv6 majburiy: serverimizning api.telegram.org ga IPv4 yo'li deyarli
  # ishlamaydi (10 urinishdan 1 tasi), IPv6 esa 10/10 ulanadi. IPv6siz
  # konteyner buzuq yo'ldan ketadi va xabar yubora olmaydi.
  default:
    enable_ipv6: true

# Bot polling orqali ishlaydi — hech qanday port ochish yoki domen kerak emas.
